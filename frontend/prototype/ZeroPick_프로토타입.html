<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroPick — 저당·제로 식품 검색 + AI 추천 (프로토타입)</title>
<style>
  :root{
    --bg:#f8f9fb; --card:#fff; --line:#e5e7eb; --line2:#eef0f3;
    --text:#1f2937; --muted:#6b7280; --faint:#9ca3af;
    --indigo:#6366f1; --indigo-d:#4f46e5; --indigo-bg:#eef2ff;
    --price:#ef4444; --green:#10b981; --green-bg:#ecfdf5;
    --red-bg:#fef2f2; --red:#dc2626;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mono:Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--text);font-size:14px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}

  /* ── header ── */
  header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
  .hw{max-width:1180px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:26px}
  .logo{font-size:21px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .logo .zp{color:var(--indigo)}
  .gnav{display:flex;gap:2px}
  .gnav button{border:none;background:none;padding:19px 12px 17px;font-size:14.5px;color:var(--muted);border-bottom:2px solid transparent}
  .gnav button.on{color:var(--text);font-weight:700;border-bottom-color:var(--indigo)}
  .searchbox{flex:1;max-width:420px;position:relative}
  .searchbox input{width:100%;border:none;background:var(--bg);border-radius:20px;padding:10px 42px 10px 18px;font-size:13.5px;font-family:inherit;outline:none}
  .searchbox .go{position:absolute;right:5px;top:5px;width:30px;height:30px;border-radius:50%;border:none;background:var(--indigo);color:#fff;font-size:13px}
  .hbtns{margin-left:auto;display:flex;gap:8px;align-items:center;white-space:nowrap}
  .profileb{border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 16px;font-size:13px}
  .profileb b{color:var(--indigo)}
  .joinb{border:none;background:var(--indigo);color:#fff;border-radius:18px;padding:9px 18px;font-size:13px;font-weight:600}

  /* ── layout ── */
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 120px;display:flex;gap:22px;align-items:flex-start}
  aside{width:200px;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 14px;position:sticky;top:80px;max-height:calc(100vh - 100px);overflow-y:auto}
  aside h5{margin:0 0 9px;font-size:12.5px;color:var(--muted);font-weight:700}
  aside section{margin-bottom:18px}
  .catlist{display:flex;flex-wrap:wrap;gap:5px}
  .cat{border:1px solid var(--line);border-radius:14px;padding:4px 11px;font-size:12px;background:#fff;color:var(--muted)}
  .cat.on{background:var(--indigo-bg);border-color:var(--indigo);color:var(--indigo-d);font-weight:600}
  .swlist{display:flex;flex-direction:column;gap:3px;max-height:300px;overflow-y:auto}
  .swrow{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:7px;font-size:12.5px;color:var(--muted)}
  .swrow:hover{background:var(--bg)}
  .swrow input{accent-color:var(--indigo)}
  .swrow.banned{color:var(--red);font-weight:600}
  .swrow.banned::after{content:"제외";margin-left:auto;font-size:10px;background:var(--red-bg);padding:1px 6px;border-radius:8px;flex:none}
  .kcal-in{display:flex;gap:6px;align-items:center}
  .kcal-in input{width:64px;border:1px solid var(--line);border-radius:7px;padding:6px;font-size:12.5px;font-family:inherit}
  .resetb{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;font-size:12.5px;color:var(--muted)}

  main{flex:1;min-width:0}
  .toolbar{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .toolbar h2{font-size:19px;margin:0}
  .toolbar .cnt{color:var(--muted);font-size:13px}
  .toolbar select{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:#fff}
  .hint{font-size:12px;color:var(--faint);margin:0 0 14px}
  .hint b{color:var(--indigo)}

  /* ── AI 추천 스트립 ── */
  .aistrip{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #e0e7ff;border-radius:14px;padding:16px 18px;margin-bottom:20px}
  .aistrip .t{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .aistrip .t h3{margin:0;font-size:15.5px}
  .aistrip .t small{color:var(--muted);font-size:12px}
  .aistrip .t .more{margin-left:auto;border:none;background:none;color:var(--indigo-d);font-size:12.5px;font-weight:600}
  .airow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:900px){.airow{grid-template-columns:1fr}}
  .aicard{background:#fff;border-radius:11px;padding:12px;display:flex;gap:11px;cursor:pointer;border:1px solid #e0e7ff}
  .aicard .rank{font-size:11px;font-weight:800;color:var(--indigo);flex:none}
  .aicard .thumb2{width:52px;height:52px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
  .aicard h4{margin:0 0 2px;font-size:13px}
  .aicard .why{font-size:11px;color:var(--muted);line-height:1.45}
  .aicard .why em{font-style:normal;color:var(--indigo-d)}

  /* ── product grid ── */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
  .pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;position:relative;display:flex;flex-direction:column;gap:7px;transition:box-shadow .15s;cursor:pointer}
  .pcard:hover{box-shadow:0 4px 16px rgba(0,0,0,.07)}
  .cmpb{position:absolute;top:10px;right:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:3px 9px;font-size:11px;color:var(--muted);z-index:2}
  .cmpb.on{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700}
  .thumb{height:110px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:48px}
  .pcard h4{margin:2px 0 0;font-size:13.5px;line-height:1.35;min-height:36px}
  .brand{font-size:11.5px;color:var(--faint)}
  .nut{font-size:11.5px;color:var(--muted)}
  .nut b{color:var(--text);font-weight:600}
  .badges{display:flex;flex-wrap:wrap;gap:4px;min-height:20px}
  .bdg{font-size:10.5px;background:var(--indigo-bg);color:var(--indigo-d);border-radius:9px;padding:2px 7px}
  .bdg.none{background:var(--green-bg);color:var(--green)}
  .bdg.ban{background:var(--red-bg);color:var(--red);text-decoration:line-through}
  .bdg.airec{background:#fef3c7;color:#b45309;font-weight:700}
  .prow{display:flex;align-items:center;margin-top:2px}
  .krw{font-size:15.5px;font-weight:800;color:var(--price)}
  .krw small{font-size:10.5px;font-weight:600;margin-left:2px}
  .stock{margin-left:auto;font-size:10.5px;color:var(--faint)}
  .stock.low{color:var(--red);font-weight:700}
  .cardacts{display:flex;gap:6px}
  .cardacts button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 0;font-size:12px}
  .cardacts button.buy{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
  .soldban{position:absolute;inset:0;background:rgba(255,255,255,.72);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--red);z-index:3}

  /* ── compare tray & modal ── */
  .tray{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.08);z-index:60;transform:translateY(110%);transition:.2s}
  .tray.show{transform:none}
  .trayw{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .trayitem{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:12.5px;background:var(--bg)}
  .trayitem button{border:none;background:none;color:var(--faint);font-size:13px;padding:0}
  .traygo{margin-left:auto;border:none;background:var(--indigo);color:#fff;border-radius:9px;padding:11px 22px;font-size:13.5px;font-weight:700}
  .traygo:disabled{background:#c7cbe8}

  .modalbg{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto}
  .modalbg.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:26px 28px;position:relative}
  .modal .x{position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;color:var(--faint)}
  .modal h3{margin:0 0 4px;font-size:18px}
  .modal .sub2{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  table{border-collapse:collapse;width:100%;font-size:13px;margin:10px 0}
  th,td{border:1px solid var(--line2);padding:9px 12px;text-align:left}
  thead th{background:var(--bg);color:var(--muted);font-weight:600;font-size:12px}
  td.best{background:var(--green-bg);font-weight:700}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:15px;padding:6px 13px;font-size:12.5px;user-select:none;cursor:pointer}
  .chip.on{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:600}
  .chip.ban.on{background:var(--red);border-color:var(--red)}
  .mh5{font-size:13px;font-weight:700;margin:14px 0 2px}
  .mh5 small{color:var(--faint);font-weight:400;margin-left:6px}

  /* ── cart / events ── */
  .list{display:flex;flex-direction:column;gap:10px}
  .lrow{background:#fff;border:1px solid var(--line);border-radius:11px;padding:13px 16px;display:flex;align-items:center;gap:13px}
  .lrow .thumb2{width:46px;height:46px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px}
  .lrow .nm{font-size:13.5px;font-weight:600}
  .lrow .mt{font-size:11.5px;color:var(--faint)}
  .lrow .rp{margin-left:auto;font-weight:800;color:var(--price)}
  .qty{display:flex;align-items:center;gap:8px}
  .qty button{width:24px;height:24px;border:1px solid var(--line);background:#fff;border-radius:6px}
  .orderbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-top:14px;display:flex;align-items:center}
  .orderbar .tt{font-size:15px}
  .orderbar .tt b{color:var(--price);font-size:18px}
  .orderbar button{margin-left:auto;border:none;background:var(--indigo);color:#fff;border-radius:10px;padding:13px 30px;font-size:14px;font-weight:700}
  .log{background:#111827;color:#d1d5db;border-radius:12px;padding:16px;font-family:var(--mono);font-size:12px;max-height:460px;overflow:auto;line-height:1.7}
  .log .tp{color:#34d399}.log .ev{color:#fbbf24}.log .tm{color:#6b7280}
  .empty{color:var(--faint);padding:44px;text-align:center;border:1.5px dashed var(--line);border-radius:12px;background:#fff}
  /* ── 챗봇 ── */
  .chatfab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;border:none;
    background:var(--indigo);color:#fff;font-size:24px;box-shadow:0 6px 20px rgba(79,70,229,.4);z-index:80}
  .chatpanel{position:fixed;bottom:92px;right:24px;width:372px;max-width:calc(100vw - 32px);height:520px;
    background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.16);
    z-index:80;display:none;flex-direction:column;overflow:hidden}
  .chatpanel.show{display:flex}
  .chathead{background:var(--indigo);color:#fff;padding:13px 16px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .chathead small{font-weight:400;opacity:.75;font-size:11px}
  .chathead .x2{margin-left:auto;border:none;background:none;color:#fff;font-size:16px;opacity:.8}
  .chatmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .cmsg{max-width:86%;padding:9px 12px;border-radius:13px;font-size:12.8px;line-height:1.55}
  .cmsg.bot{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
  .cmsg.user{background:var(--indigo);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
  .cmsg .mini{display:flex;gap:8px;align-items:center;border:1px solid var(--line2);border-radius:9px;
    padding:7px 9px;margin-top:7px;cursor:pointer;background:var(--bg)}
  .cmsg .mini:hover{border-color:var(--indigo)}
  .cmsg .mini .me{font-size:20px}
  .cmsg .mini .mn{font-size:12px;font-weight:600}
  .cmsg .mini .mm{font-size:10.5px;color:var(--muted)}
  .cmsg .mini .mp{margin-left:auto;font-size:12px;font-weight:800;color:var(--price);white-space:nowrap}
  .cmsg .src{font-size:10.5px;color:var(--faint);margin-top:6px}
  .chatchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px;background:var(--bg)}
  .chatchips button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:5px 11px;font-size:11px;color:var(--indigo-d)}
  .chatin{display:flex;gap:8px;padding:11px 12px;border-top:1px solid var(--line);background:#fff}
  .chatin input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:12.8px;font-family:inherit;outline:none}
  .chatin input:focus{border-color:var(--indigo)}
  .chatin button{border:none;background:var(--indigo);color:#fff;border-radius:10px;padding:0 16px;font-weight:700}
  .toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .devnote{font-size:11.5px;color:var(--faint);margin-top:20px;padding-top:12px;border-top:1px solid var(--line2)}
</style>
<style id="uxv2">
  :root{
    --bg:#F6F7F9; --card:#FFF; --line:#E6E8EC; --line2:#F0F1F4;
    --text:#111827; --muted:#6B7280; --faint:#9CA3AF;
    --indigo:#4F46E5; --indigo-d:#4338CA; --indigo-bg:#EEF2FF;
    --price:#111827; --green:#10B981; --green-bg:#ECFDF5;
    --shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
    --shadow-lg:0 4px 6px -2px rgba(16,24,40,.05),0 12px 26px -6px rgba(16,24,40,.12);
  }
  body{font-family:'Pretendard','Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);
       -webkit-font-smoothing:antialiased}
  /* 헤더 */
  header{box-shadow:0 1px 0 var(--line), 0 4px 14px -8px rgba(16,24,40,.08)}
  .logo{font-size:20px;letter-spacing:-.03em}
  .logo .zp{background:linear-gradient(135deg,#6366F1,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .gnav button{font-weight:600;border-radius:0;transition:color .12s}
  .gnav button:hover{color:var(--text)}
  .gnav button.on{color:var(--indigo);border-bottom:2.5px solid var(--indigo)}
  .searchbox input{background:#F3F4F6;border:1.5px solid transparent;border-radius:12px;transition:all .15s}
  .searchbox input:focus{background:#fff;border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg);outline:none}
  .searchbox .go{background:var(--indigo);border-radius:9px}
  .joinb{background:linear-gradient(135deg,#6366F1,#7C3AED);border-radius:11px;font-weight:700;
         box-shadow:0 2px 6px -1px rgba(99,102,241,.4);transition:transform .12s, box-shadow .12s}
  .joinb:hover{transform:translateY(-1px);box-shadow:0 4px 10px -2px rgba(99,102,241,.5)}
  .profileb{border-radius:11px;transition:border-color .12s, background .12s}
  .profileb:hover{border-color:#C7D2FE;background:#FAFAFF}
  /* 사이드 필터 */
  aside section{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  aside h5{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--faint);text-transform:uppercase}
  .cat{border-radius:9px;border:1px solid var(--line);transition:all .12s}
  .cat:hover{border-color:#C7D2FE;color:var(--indigo)}
  .cat.on{background:var(--indigo);border-color:var(--indigo);color:#fff;font-weight:700;
          box-shadow:0 2px 5px -1px rgba(79,70,229,.35)}
  .swrow{border-radius:8px;transition:background .1s}
  .swrow input{accent-color:var(--indigo)}
  .resetb{border-radius:10px;font-weight:600;transition:all .12s}
  .resetb:hover{border-color:var(--faint);background:#FAFAFA}
  /* 툴바 */
  .toolbar select{border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:600}
  /* 상품 카드 */
  .grid{gap:14px}
  .pcard{border-radius:16px;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;overflow:hidden}
  .pcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#D6DAFB}
  .thumb{border-radius:12px;background:#FAFAFC;border:1px solid var(--line2)}
  .pcard h4{font-weight:700;letter-spacing:-.01em}
  .brand{font-size:11.5px}
  .bdg{border-radius:6px;font-weight:600}
  .bdg.airec{background:linear-gradient(135deg,#EEF2FF,#F5F3FF);color:#6D28D9;border:1px solid #DDD6FE;font-weight:700}
  .krw{font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .krw small{color:var(--muted);font-weight:600}
  .stock{font-variant-numeric:tabular-nums}
  .cardacts button{border-radius:10px;font-weight:600;transition:all .12s}
  .cardacts button:hover{border-color:#C7D2FE;background:#FAFAFF}
  .cardacts button.buy{background:var(--indigo);font-weight:700;box-shadow:0 2px 5px -1px rgba(79,70,229,.35)}
  .cardacts button.buy:hover{background:var(--indigo-d)}
  .cmpb{border-radius:8px;font-weight:600;backdrop-filter:blur(3px);background:rgba(255,255,255,.85)}
  .cmpb.on{background:var(--indigo);box-shadow:0 2px 5px -1px rgba(79,70,229,.4)}
  /* 비교 트레이 · 모달 */
  .tray{box-shadow:0 -6px 24px -8px rgba(16,24,40,.16);border-top:1px solid var(--line)}
  .traygo{border-radius:11px;font-weight:700;background:var(--indigo)}
  .modal{border-radius:20px;box-shadow:0 24px 60px -12px rgba(16,24,40,.3)}
  .chip{border-radius:9px;transition:all .12s}
  .chip.on{background:var(--indigo);border-color:var(--indigo);box-shadow:0 2px 5px -1px rgba(79,70,229,.35)}
  /* 장바구니 · 주문 */
  .lrow{border-radius:12px}
  .qty button{border-radius:8px}
  .orderbar{border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line)}
  .orderbar button{border-radius:12px;font-weight:700;background:var(--indigo)}
  /* 챗봇 */
  .chatfab{background:linear-gradient(135deg,#6366F1,#8B5CF6);box-shadow:0 8px 20px -6px rgba(99,102,241,.55);
           transition:transform .15s, box-shadow .15s}
  .chatfab:hover{transform:scale(1.07);box-shadow:0 10px 26px -6px rgba(99,102,241,.65)}
  .chatpanel{border-radius:18px;box-shadow:0 24px 60px -12px rgba(16,24,40,.28);border:1px solid var(--line)}
  .chathead{background:linear-gradient(135deg,#4F46E5,#7C3AED)}
  .cmsg.user{background:var(--indigo)}
  .chatin input:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg)}
  .chatin button{background:var(--indigo);border-radius:10px}
  .chatchips button{border-radius:16px;transition:all .12s}
  .chatchips button:hover{border-color:var(--indigo);color:var(--indigo)}
  .toast{border-radius:12px;box-shadow:var(--shadow-lg)}
  .devnote{border-radius:12px}
</style>
</head>
<body>

<header><div class="hw">
  <div class="logo">🥤 Zero<span class="zp">Pick</span></div>
  <nav class="gnav" id="gnav"></nav>

/* ════════════════ 추천 점수 — GET /recommendation-service/recommendations/{memberId} (기획서 §8) ════════════════ */
let RECO_TOP = new Set(), RECO_WHY = {};
function scoreAll(){
  const W = {PRODUCT_VIEWED:1, CART_ADDED:0, ORDER_COMPLETED:50};
  const out = {};
  for (const p of P){
    if (p.sw.some(sw=>S.banSw.includes(sw))) continue;   // 하드 필터
    let sc=0; const why=[];
    if (p.sugar===0){sc+=1.5; why.push("당류 0g");}
    else if (p.sugar<=3){sc+=.7; why.push(`당류 ${p.sugar}g`);}
    let d=0,c=0;
    for (const b of S.events){ if(b.productId===p.id) d+=W[b.type]; else if(b.cat===p.cat) c+=W[b.type]*.5; }
    if(d){sc+=d; why.push(`이 상품 행동 +${d}`);}
    if(c){sc+=c; why.push(`${p.cat} 관심 +${c.toFixed(1)}`);}
    out[p.id]={s:sc, why};
  }
  return out;
}
function recommend(){
  const pool = P.filter(p => !p.sw.some(s=>S.banSw.includes(s)) && p.stock>0);
  const W = {PRODUCT_VIEWED:1, CART_ADDED:0, ORDER_COMPLETED:50};
  const catN = {};
  S.events.forEach(b=>{ catN[b.cat]=(catN[b.cat]||0)+1; });
  const scored = pool.map(p=>{
    let s=0; const why=[];
    if (S.banSw.length) why.push(`<em>${S.banSw.join("·")}</em> 제외 충족`);
    if (p.sugar===0){s+=1.5; why.push("당류 0g");}
    else if (p.sugar<=3){s+=.7; why.push(`당류 ${p.sugar}g`);}
    let d=0,c=0;
    for (const b of S.events){ if(b.productId===p.id) d+=W[b.type]; else if(b.cat===p.cat) c+=W[b.type]*.5; }
    if(d){s+=d; why.push(`이 상품 행동 +${d}`);}
    if(c){s+=c; why.push(`${p.cat} 행동 ${catN[p.cat]||0}회 +${c.toFixed(1)}`);}
    return {p,s,why};
  });
  scored.sort((a,b)=>b.s-a.s||a.p.price-b.p.price);
  return scored.slice(0,3);
}

/* ════════════════ 필터·정렬 ════════════════ */
function filtered(){
  const q=(document.getElementById("q")?.value||"").trim();
  let r = P.filter(p =>
    !p.sw.some(s=>S.banSw.includes(s)) &&
    (!S.cats.length || S.cats.includes(p.cat)) &&
    (S.kmin==="" || p.kcal>=+S.kmin) && (S.kmax==="" || p.kcal<=+S.kmax) &&
    (!q || p.name.includes(q) || p.brand.includes(q))
  );
  if (S.sort==="reco"){
    const sc=scoreAll();
    return r.sort((a,b)=>(sc[b.id]?.s||0)-(sc[a.id]?.s||0) || a.id-b.id);
  }
  const f={pop:(a,b)=>b.stock-a.stock, kcal:(a,b)=>a.kcal-b.kcal, price:(a,b)=>a.price-b.price, sugar:(a,b)=>a.sugar-b.sugar};
  return r.sort(f[S.sort]);
}

/* ════════════════ 상담 챗봇 (핵심 10번 — 실제 구현은 LLM API) ════════════════ */
const CHAT=[{who:"bot",html:"안녕하세요${S.member?', '+S.member.name+'님':''}! 제로픽 상담봇이에요 👋<br>조건을 말하면 맞는 상품을 찾아 드리고, 상품 설명도 해드려요.<div class='src'>실제 구현: 질의 → LLM 조건 추출 → 하드필터+행동 가중치 랭킹 → LLM 답변 생성. 프로토타입은 규칙 기반 파서(=LLM 장애 시 폴백 경로)로 동작.</div>"}];
const CHIPS=["말티톨 없는 간식 추천해줘","5천원 이하 제로 탄산 있어?","릴리스 베이킹 칩 설명해줘","프로틴 음료 뭐 있어?"];

function toggleChat(){ $("chatpanel").classList.toggle("show"); drawChat(); }
function drawChat(){
  $("chatmsgs").innerHTML = CHAT.map(m=>`<div class="cmsg ${m.who}">${m.html}</div>`).join("");
  $("chatchips").innerHTML = CHIPS.map(c=>`<button onclick="askChip('${c}')">${c}</button>`).join("");
  $("chatmsgs").scrollTop = 1e6;
}
function askChip(q){ $("chatq").value=q; sendChat(); }
function sendChat(){
  const q=$("chatq").value.trim(); if(!q) return;
  CHAT.push({who:"user",html:q}); $("chatq").value="";
  setTimeout(()=>{ CHAT.push({who:"bot",html:chatReply(q)}); drawChat(); }, 260);
  drawChat();
}
function miniCard(p, why){
  return `<div class="mini" onclick="openDetail(${p.id})"><span class="me" style="position:relative;display:inline-flex;width:1.5em;height:1.5em;align-items:center;justify-content:center">${p.e}${pic(p)}</span>

    <span class="mp">${p.price.toLocaleString()}원</span></div>`;
}
function chatReply(q){
  /* ① 상품 설명 — 상품명/브랜드가 질의에 들어 있으면 설명 생성 (LLM 상품 설명 자동 생성에 해당) */
  const target = P.find(p => q.includes(p.brand) || p.name.split(" ").some(w=>w.length>=2&&q.includes(w)&&!["제로","저당","초콜릿","프로틴","드링크","스파클링"].includes(w)));
  if (target && /설명|어때|뭐야|알려|성분|어떤/.test(q)){
    emit("PRODUCT_VIEWED", target);
    const ban = target.sw.filter(s=>S.banSw.includes(s));
    return `<b>${target.name}</b>은(는) ${target.brand}의 ${target.cat} 제품이에요.<br>
      당류 <b>${target.sugar}g</b>, ${target.kcal}kcal, 탄수화물 ${target.carb}g이고
      감미료는 ${target.sw.join(", ")||"쓰지 않았"}어요.
      ${ban.length?`<br>⚠️ 회원님이 제외한 <b>${ban.join(", ")}</b>이 포함돼 있어요.`:
                   `<br>회원님의 제외 조건과 충돌하지 않아요 ✅`}
      ${miniCard(target)}<div class="src">LLM 상품 설명 자동 생성 · PRODUCT_VIEWED 이벤트 발행됨</div>`;
  }
  /* ② 조건 추출 (실제로는 LLM 이 JSON 으로 추출 — 선택 10번 자연어 검색과 동일 파이프라인) */
  const cond={ban:[...S.banSw], cat:null, maxP:null, zero:false, protein:false};
  SW_ALL.forEach(sw=>{ if(q.includes(sw)&&/없|빼|제외|말고|안 ?들/.test(q)&&!cond.ban.includes(sw)) cond.ban.push(sw); });
  let m=q.match(/([\d,]+)\s*원\s*(이하|아래|밑|안)/); if(m) cond.maxP=+m[1].replace(/,/g,"");
  m=q.match(/(\d+)\s*천\s*원?\s*(이하|아래|밑|안)?/); if(m&&!cond.maxP) cond.maxP=+m[1]*1000;
  m=q.match(/(\d+)\s*만\s*원?\s*(이하|아래|밑|안)?/); if(m&&!cond.maxP) cond.maxP=+m[1]*10000;
  if(/당류 ?0|무설탕|제로슈거/.test(q)) cond.zero=true;
  if(/프로틴|단백질/.test(q)) cond.protein=true;
  if(/탄산|스파클링/.test(q)) cond.cat="탄산";
  else if(/음료|드링크|마실/.test(q)) cond.cat="음료";
  else if(/간식|과자|초콜릿|디저트|캔디|젤리/.test(q)) cond.cat="간식/디저트";
  else if(/시럽|소스|조미료/.test(q)) cond.cat="조미료/소스";

  let pool=P.filter(p=>!p.sw.some(s=>cond.ban.includes(s)) && p.stock>0
    && (!cond.cat||p.cat===cond.cat) && (!cond.maxP||p.price<=cond.maxP)
    && (!cond.zero||p.sugar===0) && (!cond.protein||/프로틴/.test(p.name)));
  /* ③ 랭킹 — 행동 가중치 재사용 */
  const W={PRODUCT_VIEWED:1,CART_ADDED:0,ORDER_COMPLETED:50};
  pool=pool.map(p=>{let sc=(p.sugar===0?1.5:0);
    S.events.forEach(b=>{if(b.productId===p.id)sc+=W[b.type];else if(b.cat===p.cat)sc+=W[b.type]*.5;});
    return{p,sc};}).sort((a,b)=>b.sc-a.sc||a.p.price-b.p.price).slice(0,3);

  const condTxt=[cond.ban.length?`${cond.ban.join("·")} 제외`:null, cond.cat, cond.maxP?`${cond.maxP.toLocaleString()}원 이하`:null,
    cond.zero?"당류 0g":null, cond.protein?"프로틴":null].filter(Boolean).join(" / ");
  if(!pool.length) return `조건(${condTxt||"없음"})에 맞는 상품을 못 찾았어요 😔 조건을 조금 풀어볼까요?`;
  return `<b>${condTxt||"전체"}</b> 조건으로 ${pool.length}개를 찾았어요.
    ${pool.map(({p})=>miniCard(p)).join("")}
    <div class="src">조건 추출(LLM) → 하드필터 → 행동 가중치 랭킹 · 프로필 제외 감미료는 항상 적용(조건 위반률 0%)</div>`;
}
render();
</script>
</body>
</html>
