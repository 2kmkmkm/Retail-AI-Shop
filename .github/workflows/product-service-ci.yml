name: product-service CI

on:
  pull_request:
    branches: [develop]
    paths:
      - 'product-service/**'
      - '.github/workflows/product-service-ci.yml'
  push:
    branches: [develop]
    paths:
      - 'product-service/**'
      - '.github/workflows/product-service-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven 캐시
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('product-service/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: 빌드 + 테스트
        working-directory: product-service
        run: ./mvnw clean verify

      - name: Docker 이미지 빌드 확인
        working-directory: product-service
        run: docker build --platform linux/amd64 -t product-service:ci-test .
